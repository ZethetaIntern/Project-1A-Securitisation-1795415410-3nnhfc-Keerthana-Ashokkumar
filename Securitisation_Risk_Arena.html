<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Securitisation Risk Arena</title>
<style>
:root{--bg:#0f1b2d;--card:#172a45;--ink:#eaf0f8;--mut:#9fb0c6;--acc:#2a9d8f;--warn:#e9a23b;--bad:#c8553d;--line:#27406a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}h1{margin:.2em 0;font-size:28px}h2{margin:.2em 0}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}.pill{background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#1d3558;color:var(--ink);padding:10px 14px;text-align:left}
button:hover:not(:disabled){border-color:var(--acc)}button.p{background:var(--acc);border-color:var(--acc);color:#08201d;font-weight:600;text-align:center}
.opts{display:grid;gap:8px;margin-top:10px}.ok{background:#1c5a50!important;border-color:var(--acc)!important}.no{background:#5d2c24!important;border-color:var(--bad)!important}
.lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.lv button{min-height:84px}.lock{opacity:.4}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}
.why{margin-top:10px;color:var(--mut)}.t{font-size:28px;font-weight:700}.red{color:var(--bad)}small{color:var(--mut)}
</style></head><body><main id="app"></main>
<script>
const D={"levels": [{"name": "Pool Basics", "skill": "Reading a pool summary", "intro": "Start with the tape: 500 auto loans, cut-off 31 Oct 2024.", "qs": [{"q": "What is the outstanding pool balance?", "o": ["31.78 crore", "54.61 crore", "38.13 crore", "25.42 crore"], "a": 0, "w": "Outstanding is 31.78 crore. The original balance was 54.61 crore."}, {"q": "What is the pool factor (current / original balance)?", "o": ["0.582", "0.782", "0.382", "1.000"], "a": 0, "w": "Pool factor = 317.79m / 546.07m = 0.582."}, {"q": "The weighted average coupon (WAC) is about\u2026", "o": ["10.95%", "7.00%", "14.50%", "9.50%"], "a": 0, "w": "WAC is balance-weighted: 10.95%. Note it is above the 7.00% Class A coupon, which creates excess spread."}, {"q": "How many of the 500 loans are closed (zero balance)?", "o": ["24", "9", "0", "120"], "a": 0, "w": "24 loans are closed; 476 are live. Averages should use live loans."}]}, {"name": "Delinquency Reader", "skill": "DPD buckets and RBI classes", "intro": "Which share of the book is in trouble?", "qs": [{"q": "What share of balance is 30+ DPD?", "o": ["14.1%", "7.1%", "28.2%", "5.0%"], "a": 0, "w": "30+ DPD is 14.1% of balance."}, {"q": "With a 5% 30+ DPD trigger, what is the status today?", "o": ["Breached", "Passing", "Cannot be tested", "Exactly at the limit"], "a": 0, "w": "14.1% is almost three times the 5% limit."}, {"q": "The NPA rate (overdue more than 90 days) is\u2026", "o": ["5.6%", "1.3%", "14.1%", "0%"], "a": 0, "w": "5.6%. It equals the 90+ rate because no loan sits at exactly 90 days."}, {"q": "Why does a date slicer on 2024-05-30 double the snapshot balance?", "o": ["The date appears twice in the file", "Interest is added twice", "Prepayments are counted", "It does not"], "a": 0, "w": "Two snapshots carry that date. Using a sequence key (Seq) fixes it."}]}, {"name": "Roll-Rate Detective", "skill": "Reading a transition matrix", "intro": "A roll-rate matrix shows where loans go next month.", "qs": [{"q": "Of loans that are Current, what share stay Current next month?", "o": ["93%", "60%", "99%", "75%"], "a": 0, "w": "93.4% stay current."}, {"q": "Loans at 1-29 DPD: what share cure back to Current?", "o": ["53%", "10%", "90%", "25%"], "a": 0, "w": "53.2% cure."}, {"q": "Loans at 30-59 DPD: what share roll to 60-89 DPD?", "o": ["52%", "10%", "5%", "90%"], "a": 0, "w": "52.3% roll forward, and none cure in one month."}, {"q": "What does the Default row show?", "o": ["100% stay in Default", "Half cure", "All repossessed", "Nothing"], "a": 0, "w": "Default is an absorbing state in this data."}]}, {"name": "Vintage Analyst", "skill": "Static pool and loss timing", "intro": "Compare cohorts by age, not by calendar date.", "qs": [{"q": "Why compare vintages at the same months on book?", "o": ["It compares like with like", "It is easier", "Dates are missing", "Regulators ban dates"], "a": 0, "w": "Losses depend on loan age, so only equal-age comparisons are fair."}, {"q": "At 12 months on book, what share of ultimate loss is typically realised (curve in the brief)?", "o": ["17%", "5%", "57%", "94%"], "a": 0, "w": "The curve is 5% at 6 months, 17% at 12 and 57% at 24."}, {"q": "The static data show vintages\u2026", "o": ["Behaving very similarly", "Getting steadily worse", "Improving sharply", "Not comparable"], "a": 0, "w": "Curves are close together, so no sign of vintage deterioration in this data."}, {"q": "Projected ultimate CNL by vintage is roughly\u2026", "o": ["1.2% to 1.9%", "8% to 10%", "0.1%", "20%"], "a": 0, "w": "Projections range from about 1.2% to 1.9%."}]}, {"name": "IFRS 9 Staging", "skill": "Stages and ECL", "intro": "Three stages decide the size of the provision.", "qs": [{"q": "Which stage has a loan at 45 DPD?", "o": ["Stage 2", "Stage 1", "Stage 3", "Written off"], "a": 0, "w": "30 DPD or more but below 90 is Stage 2 (lifetime ECL)."}, {"q": "Stage 3 PD is set to\u2026", "o": ["100%", "50%", "The model PD", "0%"], "a": 0, "w": "Credit-impaired loans have PD 100%, so ECL = EAD x LGD."}, {"q": "Rebuilt base ECL is about\u2026", "o": ["1.52 crore", "1.17 crore", "4.00 crore", "0.00 crore"], "a": 0, "w": "1.52 crore, versus 1.17 crore supplied."}, {"q": "Stage 3 share of ECL (base)?", "o": ["55%", "10%", "90%", "25%"], "a": 0, "w": "Stage 3 is about 5.6% of balance but 55% of ECL."}]}, {"name": "Waterfall Master", "skill": "Priority of payments and triggers", "intro": "Cash flows down the waterfall; triggers divert excess spread.", "qs": [{"q": "Who is paid first from interest collections after fees?", "o": ["Class A interest", "Equity", "Class B principal", "Servicer bonus"], "a": 0, "w": "Fees, then Class A interest, then Class B interest."}, {"q": "When a trigger fails, excess spread is\u2026", "o": ["Trapped to pay down Class A faster", "Paid to equity", "Returned to borrowers", "Ignored"], "a": 0, "w": "This is the turbo / trap mechanism."}, {"q": "In the base case, which test first fails (month 2)?", "o": ["Mezzanine OC", "Class A coupon", "Senior OC", "None fail"], "a": 0, "w": "Mezzanine OC falls below 1.10x in month 2."}, {"q": "Base-case projected CNL (% of current pool)?", "o": ["5.1%", "1.0%", "12%", "20%"], "a": 0, "w": "5.1%, including the first-month write-off of existing 90+ balances."}]}, {"name": "Stress Tester", "skill": "Scenarios and credit enhancement", "intro": "Four scenarios, one 22% cushion.", "qs": [{"q": "Crisis-scenario projected CNL is about\u2026", "o": ["16.9%", "5.1%", "30%", "2%"], "a": 0, "w": "16.9%."}, {"q": "Under Crisis, which tranche takes a principal shortfall?", "o": ["Class B", "Class A", "Both equally", "Neither"], "a": 0, "w": "Class B loses about 0.30 crore. Class A is paid in full."}, {"q": "Stressed-CE test: base CNL x 3.5 vs 22% credit enhancement\u2026", "o": ["18.0% < 22%, passes", "Fails", "Equal", "Not applicable"], "a": 0, "w": "The 3.5x multiple is an assumption to verify."}, {"q": "Equity in the Crisis scenario receives\u2026", "o": ["Nothing", "More than base", "The same as base", "Only interest"], "a": 0, "w": "Equity is wiped out; base case equity is about 3.79 crore."}]}], "crisis": [{"t": "GFC mode: rating shock", "s": "Subprime pools start to default and AAA tranches are downgraded. Your pool's OC trigger fails in month 2. What do you do first?", "o": ["Check vintage curves by cohort, not pool averages", "Wait for the next quarterly report", "Raise the AAA rating"], "a": 0, "w": "Pool averages hid deteriorating cohorts in 2008. Vintage curves expose them early."}, {"t": "GFC mode: correlation", "s": "Defaults rise together in every region. Which scenario assumption is wrong?", "o": ["That defaults are independent across loans", "That recoveries are positive", "That coupons are fixed"], "a": 0, "w": "Correlation was underestimated. Stress scenarios must move PD and severity together."}, {"t": "IL&FS mode: servicer risk", "s": "Your largest servicer has a liquidity problem. Servicer HHI is 0.34. First action?", "o": ["Check servicer-level delinquency and collection efficiency, plan back-up servicing", "Ignore it, assets are separate", "Sell the Class A"], "a": 0, "w": "Servicer concentration is a real operating risk even when assets are bankruptcy-remote."}, {"t": "IL&FS mode: early warning", "s": "The 30+ DPD rate is 14.1% against a 5% trigger. What should the dashboard show?", "o": ["Breach flag, trend and roll-rate to default", "Only the pool balance", "Nothing until 90 DPD"], "a": 0, "w": "Triggers should alert before losses crystallise."}]};let S={xp:0,done:{},best:{},badges:[]};
try{const x=localStorage.getItem('sra');if(x)S=JSON.parse(x)}catch(e){}
const save=()=>{try{localStorage.setItem('sra',JSON.stringify(S))}catch(e){}};
const $=s=>document.getElementById(s);const app=$('app');
const rank=()=>S.xp>=1100?'Chief Risk Officer':S.xp>=700?'Senior Analyst':S.xp>=300?'Analyst':'Trainee';
function head(){return `<h1>Securitisation Risk Arena</h1><small>Questions use the real numbers from the ZAAUTO2024-1 pool report. Deal terms are illustrative.</small><div class="bar"><span class="pill">XP ${S.xp}</span><span class="pill">Rank: ${rank()}</span><span class="pill">Badges: ${S.badges.length?S.badges.join(', '):'none yet'}</span></div>`}
function home(){let h=head()+'<div class="card"><h2>Choose a level</h2><div class="lv">';
D.levels.forEach((l,i)=>{const open=i==0||S.done[i-1];h+=`<button class="${open?'':'lock'}" ${open?'':'disabled'} onclick="start(${i})"><b>Level ${i+1}: ${l.name}</b><br><small>${l.skill}</small><br><small>${S.done[i]?'Best '+S.best[i]+'/'+l.qs.length:open?'Open':'Locked'}</small></button>`});
const all=D.levels.every((l,i)=>S.done[i]);h+=`<button class="${all?'':'lock'}" ${all?'':'disabled'} onclick="crisis()"><b>Level 8: Crisis Mode</b><br><small>GFC and IL&amp;FS, timed</small><br><small>${all?'Open':'Finish levels 1-7'}</small></button>`;
h+='</div></div><div class="card"><small>Pass mark: 3 of 4 correct. Each correct answer is 25 XP; a clean level gives a 50 XP bonus.</small> <button onclick="reset()">Reset progress</button></div>';app.innerHTML=h}
let cur,qi,sc,locked;
function start(i){cur=i;qi=0;sc=0;intro()}
function intro(){const l=D.levels[cur];app.innerHTML=head()+`<div class="card"><h2>Level ${cur+1}: ${l.name}</h2><p>${l.intro}</p><button class="p" onclick="ask()">Begin</button></div>`}
function shuffle(a){a=a.map((t,i)=>[t,i]);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ask(){const l=D.levels[cur],q=l.qs[qi];locked=false;const o=shuffle(q.o);
app.innerHTML=head()+`<div class="card"><div class="prog"><i style="width:${qi/l.qs.length*100}%"></i></div><small>Question ${qi+1} of ${l.qs.length}</small><h2>${q.q}</h2><div class="opts">${o.map(([t,i])=>`<button data-i="${i}" onclick="pick(this,${i})">${t}</button>`).join('')}</div><div class="why" id="why"></div></div>`}
function pick(b,i){if(locked)return;locked=true;const q=D.levels[cur].qs[qi];const good=i==q.a;if(good){sc++;S.xp+=25}
document.querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(+x.dataset.i==q.a)x.classList.add('ok')});if(!good)b.classList.add('no');
$('why').innerHTML=`<b>${good?'Correct.':'Not quite.'}</b> ${q.w}<br><br><button class="p" onclick="next()">${qi==D.levels[cur].qs.length-1?'Finish level':'Next'}</button>`}
function next(){qi++;if(qi<D.levels[cur].qs.length)ask();else end()}
function end(){const n=D.levels[cur].qs.length,pass=sc>=3;if(pass){S.done[cur]=true;S.best[cur]=Math.max(S.best[cur]||0,sc)}
if(sc==n){S.xp+=50;const b='Level '+(cur+1)+' perfect';if(!S.badges.includes(b))S.badges.push(b)}save();
app.innerHTML=head()+`<div class="card"><h2>${pass?'Level complete':'Try again'}</h2><p>You scored ${sc} of ${n}.${pass?'':' You need 3 to unlock the next level.'}</p><button class="p" onclick="home()">Back to levels</button> ${pass?'':'<button onclick="start('+cur+')">Retry</button>'}</div>`}
let ci,cs,tm,left;
function crisis(){ci=0;cs=0;nextC()}
function nextC(){if(ci>=D.crisis.length)return endC();const c=D.crisis[ci];left=20;locked=false;
app.innerHTML=head()+`<div class="card"><small>Decision ${ci+1} of ${D.crisis.length}</small> <span class="t red" id="tm">${left}</span><h2>${c.t}</h2><p>${c.s}</p><div class="opts">${c.o.map((t,i)=>`<button data-i="${i}" onclick="pickC(this,${i})">${t}</button>`).join('')}</div><div class="why" id="why"></div></div>`;
clearInterval(tm);tm=setInterval(()=>{left--;$('tm').textContent=left;if(left<=0){clearInterval(tm);pickC(null,-1)}},1000)}
function pickC(b,i){if(locked)return;locked=true;clearInterval(tm);const c=D.crisis[ci];const good=i==c.a;if(good){cs++;S.xp+=40+left}
document.querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(+x.dataset.i==c.a)x.classList.add('ok')});if(b&&!good)b.classList.add('no');
$('why').innerHTML=`<b>${i<0?'Time is up.':good?'Right call.':'Wrong call.'}</b> ${c.w}<br><br><button class="p" onclick="ci++;nextC()">Continue</button>`}
function endC(){if(cs==D.crisis.length&&!S.badges.includes('Crisis survivor'))S.badges.push('Crisis survivor');save();
app.innerHTML=head()+`<div class="card"><h2>Crisis mode over</h2><p>${cs} of ${D.crisis.length} decisions were right. Faster answers earn bonus XP.</p><button class="p" onclick="home()">Back to levels</button></div>`}
function reset(){if(confirm('Reset all progress?')){S={xp:0,done:{},best:{},badges:[]};save();home()}}
home();
</script></body></html>
